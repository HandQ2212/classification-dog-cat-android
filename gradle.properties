# LiteRT 2.2.0 khai báo cùng namespace "com.google.ai.edge.litert" cho cả hai artifact
# litert và litert-api. Đây là lỗi đóng gói của thư viện, không phải của project này.
# AGP 9 mặc định coi namespace trùng là lỗi, nên phải tắt kiểm tra để build được.
android.uniquePackageNames=false
